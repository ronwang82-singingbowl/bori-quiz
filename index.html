ackground: oklch(97% 0.014 85); }\n    * { box-sizing: border-box; font-family: 'Noto Sans TC', sans-serif; }\n    .serif { font-family: 'Noto Serif TC', serif; }\n    @media (max-width: 520px) {\n      .quiz-options-grid { grid-template-columns: 1fr !important; }\n      .page-header { flex-wrap: wrap; gap: 12px; }\n      .channel-item { width: 68px !important; }\n      .channel-item image-slot { width: 68px !important; height: 68px !important; }\n    }\n  </style>\n  <script src=\"7a10f93f-03ba-48df-80bc-b617dcbb8ceb\"><\/script>\n</helmet>\n\n<div style=\"min-height:100vh; background:oklch(97% 0.014 85); color:oklch(32% 0.05 150); padding:56px 24px 96px; display:flex; flex-direction:column; align-items:center;\">\n\n  <div class=\"page-header\" style=\"width:100%; max-width:920px; display:flex; justify-content:space-between; align-items:center; margin-bottom:48px;\">\n    <div style=\"display:flex; align-items:center; gap:10px;\"><img src=\"{{ logoSrc }}\" alt=\"缽日 BORI\" style=\"width:34px; height:34px; border-radius:50%; object-fit:cover; flex:0 0 auto;\"><div class=\"serif\" style=\"font-size:18px; letter-spacing:0.05em; color:oklch(32% 0.05 150); line-height:1.4;\">屬於你現在的內在天氣</div></div>\n    <div style=\"display:flex; gap:8px;\">\n      <button sc-camel-on-click=\"{{ goGallery }}\" style=\"border:none; background:{{ galleryTabBg }}; color:{{ galleryTabColor }}; padding:8px 16px; border-radius:999px; font-size:14px; cursor:pointer;\">圖鑑頁</button>\n    </div>\n  </div>\n\n  <sc-if value=\"{{ isGallery }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"width:100%; max-width:920px; display:flex; flex-direction:column; align-items:center; gap:16px;\">\n      <h1 class=\"serif\" style=\"font-size:26px; font-weight:500; margin:0 0 8px;\">內在天氣圖鑑</h1>\n      <p style=\"font-size:15px; color:oklch(45% 0.06 50); margin:0 0 24px; text-align:center; line-height:1.8;\">平時的樣子，等權重並排，沒有哪一個特別被放大。</p>\n      <div style=\"display:flex; flex-wrap:wrap; justify-content:center; gap:14px; width:100%;\">\n        <sc-for list=\"{{ galleryChannels }}\" as=\"ch\" hint-placeholder-count=\"8\">\n          <div class=\"channel-item\" style=\"width:82px; flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:8px;\">\n            <image-slot id=\"{{ ch.slotId }}\" shape=\"rounded\" radius=\"14\" style=\"width:82px; height:82px;\" placeholder=\"{{ ch.placeholder }}\" src=\"{{ ch.img }}\"></image-slot>\n            <div style=\"text-align:center;\">\n              <div class=\"serif\" style=\"font-size:14px; font-weight:600;\">{{ ch.name }}</div>\n              <div style=\"font-size:11px; color:oklch(45% 0.06 50); margin-top:2px;\">{{ ch.phrase }}</div>\n            </div>\n          </div>\n        </sc-for>\n      </div>\n      <button sc-camel-on-click=\"{{ goQuiz }}\" style=\"border:none; background:oklch(32% 0.05 150); color:oklch(97% 0.014 85); padding:18px 56px; border-radius:999px; font-size:17px; font-weight:600; cursor:pointer; margin-top:16px;\" style-hover=\"background:oklch(28% 0.05 150);\">開始測驗</button>\n    </div>\n  </sc-if>\n\n  <sc-if value=\"{{ isQuiz }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"width:100%; max-width:640px; display:flex; flex-direction:column; align-items:center; gap:28px;\">\n      <div style=\"font-size:13px; letter-spacing:0.1em; color:oklch(55% 0.04 55);\">第 {{ questionNumber }} / 4 題</div>\n      <h2 class=\"serif\" style=\"font-size:22px; font-weight:500; text-align:center; line-height:1.7; margin:0;\">{{ currentQuestion.prompt }}</h2>\n      <div class=\"quiz-options-grid\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%;\">\n        <sc-for list=\"{{ currentQuestion.options }}\" as=\"opt\" hint-placeholder-count=\"8\">\n          <button sc-camel-on-click=\"{{ opt.onSelect }}\" style=\"text-align:left; border:1px solid oklch(85% 0.02 80); background:oklch(99% 0.008 85); border-radius:14px; padding:16px 18px; font-size:14px; line-height:1.6; color:oklch(32% 0.05 150); cursor:pointer;\" style-hover=\"border-color:oklch(75% 0.12 85); background:oklch(97% 0.03 85);\">{{ opt.text }}</button>\n        </sc-for>\n      </div>\n    </div>\n  </sc-if>\n\n  <sc-if value=\"{{ isResult }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"width:100%; max-width:920px; display:flex; flex-direction:column; align-items:center; gap:40px;\">\n      <div style=\"display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-end; gap:14px; width:100%;\">\n        <sc-for list=\"{{ resultChannels }}\" as=\"ch\" hint-placeholder-count=\"8\">\n          <div style=\"width:{{ ch.size }}px; flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:8px; opacity:{{ ch.opacity }}; filter:{{ ch.filter }}; transition:all 0.5s ease;\">\n            <image-slot id=\"{{ ch.slotId }}\" shape=\"rounded\" radius=\"14\" style=\"width:{{ ch.size }}px; height:{{ ch.size }}px;\" placeholder=\"{{ ch.placeholder }}\" src=\"{{ ch.img }}\"></image-slot>\n            <div style=\"text-align:center;\">\n              <div class=\"serif\" style=\"font-size:13px; font-weight:600;\">{{ ch.name }}</div>\n            </div>\n          </div>\n        </sc-for>\n      </div>\n\n      <div style=\"max-width:600px; display:flex; flex-direction:column; align-items:center; gap:20px; text-align:center;\">\n        <h1 class=\"serif\" style=\"font-size:24px; font-weight:500; line-height:1.7; margin:0;\">{{ headline }}</h1>\n        <p style=\"font-size:16px; line-height:1.9; color:oklch(38% 0.05 145); margin:0;\">{{ pairedSentence }}</p>\n        <p style=\"font-size:14px; line-height:1.9; color:oklch(55% 0.04 55); margin:0;\">{{ weatherSentence }}</p>\n\n        <div style=\"display:flex; flex-direction:column; gap:16px; width:100%; max-width:480px; margin-top:8px; text-align:left;\">\n          <sc-for list=\"{{ selectedChannelDetails }}\" as=\"detail\" hint-placeholder-count=\"2\">\n            <div style=\"border-top:1px solid oklch(88% 0.02 80); padding-top:14px; display:flex; gap:12px; align-items:flex-start;\">\n              <image-slot id=\"{{ detail.slotId }}\" shape=\"rounded\" radius=\"13\" style=\"width:57px; height:57px; flex:0 0 auto;\" placeholder=\"{{ detail.name }}\" src=\"{{ detail.img }}\"></image-slot>\n              <div style=\"flex:1; min-width:0;\">\n                <div class=\"serif\" style=\"font-size:15px; font-weight:600; color:oklch(32% 0.05 150); margin-bottom:4px;\">{{ detail.name }}｜{{ detail.phrase }}</div>\n                <div style=\"font-size:14px; line-height:1.8; color:oklch(38% 0.05 145); margin-bottom:6px;\">{{ detail.oneLine }}</div>\n                <div style=\"font-size:13px; line-height:1.8; color:oklch(45% 0.06 50);\">{{ detail.example }}</div>\n              </div>\n            </div>\n          </sc-for>\n        </div>\n\n        <div style=\"display:flex; flex-direction:column; align-items:center; gap:14px; margin-top:12px;\">\n          <p style=\"font-size:14px; line-height:1.8; color:oklch(38% 0.05 145); margin:0; max-width:480px;\">如果你想要為自己找回、聽見 自己的聲音<br>歡迎點擊下方連結</p>\n          <a href=\"{{ lineUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration:none; background:oklch(75% 0.12 85); color:oklch(25% 0.05 90); padding:14px 32px; border-radius:999px; font-size:15px; font-weight:600;\" style-hover=\"background:oklch(70% 0.13 85);\">缽日官網</a>\n        </div>\n\n        <button sc-camel-on-click=\"{{ resetQuiz }}\" style=\"border:none; background:none; color:oklch(55% 0.04 55); font-size:13px; margin-top:8px; cursor:pointer; text-decoration:underline;\">重新測驗一次</button>\n      </div>\n    </div>\n  </sc-if>\n\n</div>\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;lineUrl&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;https://ronwang82-singingbowl.github.io/adayofsingingbowl/&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;CTA&quot;}}\">\nfunction getChannels() {\n  return [\n    { id: 1, name: '地脈', phrase: '身體先知道', oneLine: '你的身體比腦袋更早知道答案', example: '開會前你還沒意識到緊張，但肩膀已經先僵硬起來——這就是地脈型的人', img: (window.__resources && window.__resources.diMai) || './assets/diMai.png' },\n    { id: 2, name: '回音', phrase: '耳朵先鬆開', oneLine: '聲音還沒進到腦袋，你已經先有反應', example: '吵雜的環境讓你莫名煩躁，安靜的音樂卻能瞬間把你拉回來——這就是回音型的人', img: (window.__resources && window.__resources.huiYin) || './assets/huiYin.png' },\n    { id: 3, name: '風息', phrase: '呼吸帶著走', oneLine: '跟著呼吸走，你會自然被帶到該去的地方', example: '焦慮的時候，深呼吸幾口氣就能明顯感覺自己鬆下來——這就是風息型的人', img: (window.__resources && window.__resources.fengXi) || './assets/fengXi.png' },\n    { id: 4, name: '雷紋', phrase: '電流先醒來', oneLine: '你常常是先感覺到「一股勁」，才知道自己在想什麼', example: '突然被觸動或生氣時，手會不自覺發抖或坐不住——這就是雷紋型的人', img: (window.__resources && window.__resources.leiWen) || './assets/leiWen.png' },\n    { id: 5, name: '星圖', phrase: '閉眼看見光', oneLine: '閉上眼睛，答案常常用畫面出現，不是用文字', example: '想事情時腦中會浮現具體場景或象徵畫面，而不是條列式的想法——這就是星圖型的人', img: (window.__resources && window.__resources.xingTu) || './assets/xingTu.png' },\n    { id: 6, name: '空鏡', phrase: '靜但醒著', oneLine: '你很少「放空」，但常常能進入一種清醒的安靜', example: '靜坐或放鬆時，不是睡著，而是很清楚知道周圍發生什麼事，心裡卻異常平靜——這就是空鏡型的人', img: (window.__resources && window.__resources.kongJing) || './assets/kongJing.png' },\n    { id: 7, name: '解語', phrase: '說出來才鬆', oneLine: '想法在心裡打結，說出口的瞬間才真正解開', example: '明明自己想了很久想不通，但跟朋友講一講，講到一半突然自己就懂了——這就是解語型的人', img: (window.__resources && window.__resources.jieYu) || './assets/jieYu.png' },\n    { id: 8, name: '照心', phrase: '先照見自己', oneLine: '你常常是先在別人身上，才看懂自己', example: '看到某人的處境會突然鼻酸或有共鳴，事後發現原來是在講自己的事——這就是照心型的人', img: (window.__resources && window.__resources.zhaoXin) || './assets/zhaoXin.png' },\n  ];\n}\n\nfunction getQuestions() {\n  return [\n    {\n      prompt: '最近一次讓你特別有感覺的時刻——可能是被打動、被惹毛、或突然放鬆——你當下的反應最像哪一種？',\n      options: [\n        { channelId: 1, text: '身體先有反應，說不出所以然' },\n        { channelId: 2, text: '耳朵突然聽清楚了什麼' },\n        { channelId: 3, text: '呼吸自己變了節奏' },\n        { channelId: 4, text: '心裡一下子被電到，醒了過來' },\n        { channelId: 5, text: '閉上眼睛時反而看見畫面' },\n        { channelId: 6, text: '安靜下來，但意識還醒著' },\n        { channelId: 7, text: '話說出口才鬆了一口氣' },\n        { channelId: 8, text: '先看見了自己的樣子' },\n      ],\n    },\n    {\n      prompt: '如果現在有一段安靜的時間，你會想⋯⋯',\n      options: [\n        { channelId: 1, text: '動一動身體，讓身體帶路' },\n        { channelId: 2, text: '聽一段聲音或音樂' },\n        { channelId: 3, text: '好好呼吸幾口氣' },\n        { channelId: 4, text: '讓自己被一點刺激喚醒' },\n        { channelId: 5, text: '閉眼，看看眼前浮現什麼' },\n        { channelId: 6, text: '什麼都不做，只是安靜坐著' },\n        { channelId: 7, text: '找人說說話' },\n        { channelId: 8, text: '對著自己看一會兒' },\n      ],\n    },\n    {\n      prompt: '這陣子如果卡住了，你通常怎麼發現的？',\n      options: [\n        { channelId: 1, text: '身體先發出訊號，緊、沉、卡' },\n        { channelId: 2, text: '聲音聽起來變得刺耳或遙遠' },\n        { channelId: 3, text: '呼吸變淺、變快' },\n        { channelId: 4, text: '突然一陣情緒電流衝上來' },\n        { channelId: 5, text: '腦中畫面變得模糊或混亂' },\n        { channelId: 6, text: '心裡變得很安靜，像被按了暫停' },\n        { channelId: 7, text: '話說不出口，卡在喉嚨' },\n        { channelId: 8, text: '開始不太想看自己' },\n      ],\n    },\n    {\n      prompt: '如果要選一種方式，慢慢把自己攤開，你會靠近哪一種？',\n      options: [\n        { channelId: 1, text: '先感受身體的感覺，再慢慢鬆開' },\n        { channelId: 2, text: '讓耳朵先放鬆下來聽' },\n        { channelId: 3, text: '跟著呼吸的節奏走' },\n        { channelId: 4, text: '讓那股情緒衝一下，再慢慢說' },\n        { channelId: 5, text: '閉上眼睛，讓畫面自己浮現' },\n        { channelId: 6, text: '先安靜下來，但保持清醒' },\n        { channelId: 7, text: '邊說邊想，說著說著就懂了' },\n        { channelId: 8, text: '回想起或聽見別人的故事而被打動，才看懂自己' },\n      ],\n    },\n  ];\n}\n\nclass Component extends DCLogic {\n  state = {\n    view: 'gallery',\n    qIndex: 0,\n    answers: [],\n    optionOrders: [],\n  };\n\n  shuffle(n) {\n    const arr = Array.from({ length: n }, (_, i) => i);\n    for (let i = arr.length - 1; i > 0; i--) {\n      const j = Math.floor(Math.random() * (i + 1));\n      [arr[i], arr[j]] = [arr[j], arr[i]];\n    }\n    return arr;\n  }\n\n  newOptionOrders() {\n    return getQuestions().map(q => this.shuffle(q.options.length));\n  }\n\n  goGallery = () => this.setState({ view: 'gallery' });\n  goQuiz = () => this.setState({ view: 'quiz', qIndex: 0, answers: [], optionOrders: this.newOptionOrders() });\n  resetQuiz = () => this.setState({ view: 'quiz', qIndex: 0, answers: [], optionOrders: this.newOptionOrders() });\n\n  selectAnswer(channelId) {\n    const answers = [...this.state.answers, channelId];\n    const questions = getQuestions();\n    if (answers.length >= questions.length) {\n      this.setState({ answers, view: 'result' });\n    } else {\n      this.setState({ answers, qIndex: this.state.qIndex + 1 });\n    }\n  }\n\n  pickResultChannels(answers) {\n    const counts = {};\n    answers.forEach(id => { counts[id] = (counts[id] || 0) + 1; });\n    const allIds = getChannels().map(c => c.id);\n    const ranked = allIds.map(id => ({ id, count: counts[id] || 0 }))\n      .sort((a, b) => b.count - a.count);\n    const secondCount = ranked[1].count;\n    let selected = ranked.filter(r => r.count > 0 && r.count >= secondCount).map(r => r.id);\n    if (selected.length > 3) selected = selected.slice(0, 3);\n    if (selected.length < 2) selected = ranked.slice(0, 2).map(r => r.id);\n    return selected;\n  }\n\n  renderVals() {\n    const { view, qIndex, answers, optionOrders } = this.state;\n    const isGallery = view === 'gallery';\n    const isQuiz = view === 'quiz';\n    const isResult = view === 'result';\n    const CHANNELS = getChannels();\n    const QUESTIONS = getQuestions();\n\n    const galleryChannels = CHANNELS.map(ch => ({\n      ...ch,\n      slotId: 'gallery-' + ch.id,\n      placeholder: ch.name + '插畫',\n    }));\n\n    let currentQuestion = { prompt: '', options: [] };\n    if (isQuiz) {\n      const q = QUESTIONS[qIndex];\n      const order = (optionOrders && optionOrders[qIndex]) || q.options.map((_, i) => i);\n      currentQuestion = {\n        prompt: q.prompt,\n        options: order.map(i => q.options[i]).map(opt => ({\n          text: opt.text,\n          onSelect: () => this.selectAnswer(opt.channelId),\n        })),\n      };\n    }\n\n    let resultChannels = [];\n    let headline = '';\n    let pairedSentence = '';\n    let selectedChannelDetails = [];\n    if (isResult) {\n      const selectedIds = this.pickResultChannels(answers);\n      resultChannels = CHANNELS.map(ch => {\n        const selected = selectedIds.includes(ch.id);\n        return {\n          ...ch,\n          slotId: 'result-' + ch.id,\n          placeholder: ch.name + '插畫',\n          opacity: selected ? 1 : 0.35,\n          filter: selected ? 'none' : 'grayscale(1)',\n          size: selected ? 107 : 82,\n        };\n      });\n      const selectedChannels = CHANNELS.filter(ch => selectedIds.includes(ch.id));\n      headline = '這次比較有回應的線索是：' + selectedChannels.map(c => c.name).join('、');\n      pairedSentence = selectedChannels.map(c => c.phrase).join('、') + '——這幾天，你比較用這樣的方式在流動。';\n      selectedChannelDetails = selectedChannels.map(c => ({ id: c.id, slotId: 'detail-' + c.id, name: c.name, phrase: c.phrase, oneLine: c.oneLine, example: c.example, img: c.img }));\n    }\n\n    return {\n      isGallery, isQuiz, isResult,\n      logoSrc: (window.__resources && window.__resources.logo) || '',\n      galleryChannels,\n      questionNumber: qIndex + 1,\n      currentQuestion,\n      resultChannels,\n      headline,\n      pairedSentence,\n      selectedChannelDetails,\n      weatherSentence: '這不是你的答案，是這次的天氣。三個月後，可能又換了一種樣子。',\n      lineUrl: this.props.lineUrl || 'https://ronwang82-singingbowl.github.io/adayofsingingbowl/',\n      goGallery: this.goGallery,\n      goQuiz: this.goQuiz,\n      resetQuiz: this.resetQuiz,\n      galleryTabBg: isGallery ? 'oklch(32% 0.05 150)' : 'oklch(93% 0.02 85)',\n      galleryTabColor: isGallery ? 'oklch(97% 0.014 85)' : 'oklch(32% 0.05 150)',\n      quizTabLabel: isResult ? '回圖鑑頁' : '開始測驗',\n      quizTabOnClick: isResult ? this.goGallery : this.goQuiz,\n      quizTabBg: isQuiz ? 'oklch(32% 0.05 150)' : 'oklch(93% 0.02 85)',\n      quizTabColor: isQuiz ? 'oklch(97% 0.014 85)' : 'oklch(32% 0.05 150)',\n    };\n  }\n}\n<\/script>\n\n\n</body></html>"</script>
